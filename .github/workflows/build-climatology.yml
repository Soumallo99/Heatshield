name: Build NCR climatology

# A reproducible fetch for developers behind a restrictive network. It always
# produces an artifact for review; a same-repository PR may additionally commit
# the small generated aggregate (never the raw provider response).
on:
  workflow_dispatch:
  # The artifact is also built on a PR so a reviewer can inspect the exact
  # source response before the generated normal is committed.
  pull_request:
    paths:
      - ".github/workflows/build-climatology.yml"
      - "scripts/build_climatology.py"
      - "core/coupled.py"

permissions:
  # The same-repository PR job below commits only the generated normal. This
  # lets a constrained developer network retrieve a reviewed, reproducible
  # result without copying a binary Actions artifact by hand.
  contents: write

jobs:
  ncr-normals:
    name: 1991–2020 NCR daily Tmax normals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout otherwise points at a detached merge ref,
          # which cannot receive the reviewed generated normal.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the small builder dependency set
        run: python -m pip install --disable-pip-version-check pandas requests numpy
      - name: Fetch and build
        run: |
          # generated_at_utc intentionally records build time. Keep the prior
          # aggregate so the commit step can avoid a timestamp-only push loop.
          if test -f data/climatology_normals.json; then
            cp data/climatology_normals.json /tmp/ncr-normal-before-build.json
          fi
          python -m scripts.build_climatology --ncr \
            --save-raw /tmp/ncr-open-meteo-1991-2020.json \
            --output data/climatology_normals.json
      - name: Commit generated normal for a same-repository pull request
        # Never grant a fork write access. The raw source stays an artifact;
        # only the small, reviewable aggregate enters Git.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Do not create a new PR commit just because generated_at_utc changed.
          # A true normal/source/method change still goes through for review.
          if test -f /tmp/ncr-normal-before-build.json && python - <<'PY'
          import json
          import sys

          before_path = "/tmp/ncr-normal-before-build.json"
          after_path = "data/climatology_normals.json"
          try:
              with open(before_path, encoding="utf-8") as handle:
                  before = json.load(handle)
              with open(after_path, encoding="utf-8") as handle:
                  after = json.load(handle)
          except (OSError, ValueError):
              sys.exit(1)
          before.pop("generated_at_utc", None)
          after.pop("generated_at_utc", None)
          sys.exit(0 if before == after else 1)
          PY
          then
            cp /tmp/ncr-normal-before-build.json data/climatology_normals.json
            echo "climatology values already current (timestamp retained)"
            exit 0
          fi
          if test -z "$(git status --porcelain -- data/climatology_normals.json)"; then
            echo "climatology already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/climatology_normals.json
          git commit -m "Build 1991-2020 NCR climatology normals"
          git push origin "HEAD:${HEAD_REF}"
      - name: Upload generated data and source response
        uses: actions/upload-artifact@v4
        with:
          name: ncr-climatology-1991-2020
          if-no-files-found: error
          path: |
            data/climatology_normals.json
            /tmp/ncr-open-meteo-1991-2020.json
