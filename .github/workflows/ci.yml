name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Python mobile contracts use Node to server-render the actual React
      # screens and run Vite's phone bundle budget. Keep their dependencies in
      # this job instead of replacing the checks with JSX string matching.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install mobile render dependencies
        working-directory: frontend/web
        run: npm ci

      # The budget and installability tests measure real Vite output, so the
      # build belongs here rather than inside a fixture: if it fails, the
      # failing step says so by name. NODE_OPTIONS gives CesiumJS's ~4 MB bundle
      # headroom, because an OOM here is silent apart from a non-zero exit.
      - name: Build the frontend (the tests measure this output)
        working-directory: frontend/web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # Failures are echoed as check-run annotations. The raw job log lives on a
      # host that some networks (and sandboxes) cannot reach; annotations are on
      # the API, so "which test broke" is answerable from `gh` alone.
      - name: Run tests
        env:
          HS_TEST_SKIP_BUILD: "1"
        run: |
          set -o pipefail
          if python -m pytest tests -q 2>&1 | tee /tmp/pytest.log; then
            exit 0
          fi
          status=$?
          grep -E '^(FAILED|ERROR)' /tmp/pytest.log | tail -10 | while IFS= read -r line; do
            printf '::error title=Pytest failure::%s\n' "${line//\%/%25}"
          done
          tail -c 1500 /tmp/pytest.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' | while IFS= read -r encoded; do
            printf '::error title=Pytest output (tail)::%s\n' "$encoded"
          done
          exit "$status"

      # Hits the live Open-Meteo API, so it can fail for reasons outside the
      # code (rate limit, upstream outage). The 52 unit tests above are the
      # real gate; this is an end-to-end "the pipeline still runs" smoke test.
      - name: Pipeline smoke test (live forecast)
        continue-on-error: true
        run: python -m scripts.refresh

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build
        working-directory: frontend/web
        run: npm run build

      # Fails the build on an icon-only button, a clickable <div>, a missing
      # alt, or text that does not reach WCAG AA on the app's own background.
      - name: Accessibility audit
        working-directory: frontend/web
        run: npm run a11y

      # Routing, per-page titles, console hygiene, and the generated
      # robots/sitemap/llms files. No browser required.
      - name: Frontend checks
        working-directory: frontend/web
        run: npm test
