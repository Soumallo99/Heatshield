<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HeatShield — Extreme Heat Early Warning</title>

    <!--
      CONTENT SECURITY POLICY

      This is a static bundle with no inline scripts and no third-party scripts,
      so the policy can stay tight: scripts load from this origin only, which is
      what makes an injected script tag (or an eval) useless — object-src and
      base-uri are closed for the same reason.

      What needs the exceptions below, and why:
        * style-src 'unsafe-inline' — React and Cesium set element styles at
          runtime, and Vite injects <style> tags in dev.
        * img-src https: data: blob: — map tiles (Esri/OSM/OpenTopoMap) and
          Cesium's textures/skybox are loaded as images from their own hosts.
        * worker-src blob: — CesiumJS builds its workers from Blob URLs.
        * connect-src 'self' https: — the API is same-origin (Vite proxies /api
          in dev, and a static host has none), plus the service worker's own
          same-origin fetches.
        * font-src https://fonts.gstatic.com — the typefaces, with full local
          fallbacks when the network is unavailable.

      frame-ancestors, X-Frame-Options and HSTS cannot be set from a meta tag, so
      they are documented in README -> "Security" for whoever terminates TLS.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="description" content="Ward-level human thermal stress index and extreme heat early warning for Kolkata." />

    <!-- PWA -->
    <!-- Relative URLs preserve the repository subpath on GitHub Pages. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#07080d" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />

    <!--
      TYPOGRAPHY
      Instrument Serif — display. High stroke contrast, tight apertures; used sparingly
                         for statements and the brand mark.
      Inter            — UI/body. Neutral grotesque, variable, excellent tabular figures.
      JetBrains Mono   — data. Metrics, risk scores, timestamps.
      Each has a full local fallback stack, so the app still looks correct offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
