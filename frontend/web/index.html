<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HeatShield — Extreme Heat Early Warning</title>
    <meta name="description" content="Ward-level human thermal stress index and extreme heat early warning for Kolkata." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07080d" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      TYPOGRAPHY
      Instrument Serif — display. High stroke contrast, tight apertures; used sparingly
                         for statements and the brand mark.
      Inter            — UI/body. Neutral grotesque, variable, excellent tabular figures.
      JetBrains Mono   — data. Metrics, risk scores, timestamps.
      Each has a full local fallback stack, so the app still looks correct offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // sw.js must only control PRODUCTION builds. In dev it fights Vite's HMR
      // and serves stale modules — which is how a perfectly good route "stops
      // opening" on a real client while the dev server looks healthy.
      // %MODE% is substituted by Vite at serve/build time.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if ('%MODE%' === 'production') {
            // From the site ROOT so its scope is '/'.
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
          } else {
            // A worker an earlier dev session registered keeps serving stale
            // bundles. Evict it and its caches so nobody sits on old modules.
            navigator.serviceWorker
              .getRegistrations()
              .then((rs) => rs.forEach((r) => r.unregister()))
              .catch(() => {});
            if ('caches' in window) {
              caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
            }
          }
        });
      }
    </script>
  </body>
</html>
